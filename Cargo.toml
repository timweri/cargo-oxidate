[package]
name = "cargo-oxidate"
version = "0.1.5"
edition = "2024"
description = "Check Cargo dependency for packages that are too new or too old"
license = "MIT"
authors = ["Thanh Nguyen (timweri)", "Mitchell Grenier (obelisk)"]
repository = "https://github.com/timweri/cargo-oxidate"
homepage = "https://github.com/timweri/cargo-oxidate"
readme = "README.md"
keywords = ["cargo", "dependencies", "security", "supply-chain", "freshness"]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]
exclude = [
    "action.yml",
    "examples/",
    ".github/",
]

[[bin]]
name = "cargo-oxidate"
path = "src/main.rs"

[dependencies]
cargo-lock = "10"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
ureq = { version = "3", features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
semver = "1"
tempfile = "3"
toml = "0.8"

# Optimize for small binary size - reduces CI cache/download time
[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization
strip = true        # Remove debug symbols
